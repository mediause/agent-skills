name: Sync Skills Index

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-skills-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate skills index
        run: node scripts/build-skills-index.mjs

      - name: Verify generated file
        run: |
          test -f skills-index.json
          cat skills-index.json

      - name: Commit regenerated index
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- skills-index.json; then
            echo "No index changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills-index.json
          git commit -m "chore: sync skills index"
          git push